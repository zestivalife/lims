version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: lims-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lims-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lims-backend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma generate && npx prisma db push && node server.js"
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  tcp-listener:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lims-tcp-listener
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_healthy
    command: ["node", "src/integrations/tcp-listener/server.js"]
    ports:
      - "${TCP_LISTENER_PORT:-5000}:5000"

  mock-simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lims-mock-simulator
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - tcp-listener
    command: ["node", "src/integrations/mock-simulator/index.js"]

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lims-frontend
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_SOCKET_URL: http://localhost:3001
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
